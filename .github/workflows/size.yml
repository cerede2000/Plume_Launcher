name: Size
on:
  push:
    branches: ['feat/verify-size']
jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :app:assembleRelease
      - name: Analyse
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -l "$APK"
          AA=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/apkanalyzer | head -1)
          echo "analyzer: $AA"
          mkdir -p out
          "$AA" apk summary "$APK" > out/summary.txt 2>&1 || true
          "$AA" files list "$APK" > out/files.txt 2>&1 || true
          "$AA" dex packages --defined-only --proguard-mappings app/build/outputs/mapping/release/mapping.txt "$APK" > out/dex-packages.txt 2>&1 || "$AA" dex packages --defined-only "$APK" > out/dex-packages.txt 2>&1 || true
          cp app/build/outputs/mapping/release/mapping.txt out/ 2>/dev/null || true
          cp app/build/outputs/mapping/release/usage.txt out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/
          wc -l out/*
      - uses: actions/upload-artifact@v6
        with:
          name: size
          path: out
