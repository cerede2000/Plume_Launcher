# Fork CI: build the app on every push to integration and keep the APK as a workflow artifact.
name: Build

on:
  push:
    branches: [integration]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      # The upstream code has lint findings of its own, so lint reports instead of blocking the APK.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="plume-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/*.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
