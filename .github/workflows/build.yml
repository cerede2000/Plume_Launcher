# Fork CI: build the app on every push to integration and keep the APK as a workflow artifact.
name: Build

on:
  push:
    branches: [integration, 'feat/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # A stable signing key, so a new build installs over the old one and keeps Plume's settings.
      - name: Signing key
        env:
          KS: ${{ secrets.PLUME_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PLUME_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/plume.p12"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=plume\nkeyPassword=%s\n' "$RUNNER_TEMP/plume.p12" "$KS_PASS" "$KS_PASS" > keystore.properties
          fi

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      # The upstream code has lint findings of its own, so lint only reports: the run stays green and the
      # findings are in the lint-report artifact.
      - name: Lint (report only)
        run: |
          ./gradlew --no-daemon :app:lintDebug || echo "::notice::Lint found issues in the upstream code, see the lint-report artifact"

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="plume-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/*.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name"
          echo "APK bytes: $(stat -c %s "$name")"
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner" verify --print-certs "$name" | grep -E "certificate SHA-256|Signer #1 certificate DN"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
